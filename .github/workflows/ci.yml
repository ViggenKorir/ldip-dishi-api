name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nest
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nest?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/nest?schema=public
      JWT_SECRET: ci-only-not-a-secret
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma migrate deploy
      - run: pnpm lint --max-warnings=0
      - run: pnpm build
      # The committed spec is the contract: any drift fails CI.
      - run: pnpm openapi:export
      - run: git diff --exit-code openapi/
      - run: pnpm test
      - run: pnpm test:e2e
