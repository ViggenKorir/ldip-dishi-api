# version: '3.8'
services:
  nest-db:
    image: postgres:13
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root123
      POSTGRES_DB: nest
    volumes:
      - nest_db_data:/var/lib/postgresql/data
    networks:
      - nest_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nest -h localhost']
      interval: 10s # How often to run the check
      timeout: 5s # How long to wait for the check to return
      retries: 5 # How many times to retry before marking as unhealthy
      start_period: 60s # Optional: grace period for startup before failures count
